# Manuscript Studio Configuration
# Copy this file to ~/.config/manuscript-studio/config.yaml and edit

version: 1.0

# ============================================================
# Database Connection
# ============================================================
# For GCP Managed PostgreSQL, use the private IP address.
# The database itself must already exist — create it with:
#   CREATE DATABASE "<name>";
# Liquibase will create the schema automatically.
database:
  host: "localhost"
  port: 5432
  name: "manuscript_studio"
  user: "manuscript_user"
  password: "REPLACE_ME_OR_SERVER_WONT_START"

# ============================================================
# File Paths
# ============================================================
# The private directory must already exist before running install.sh.
paths:
  # Where server source and data are stored
  private_dir: "/var/www/manuscript-studio"

  # Root directory under which manuscript git checkouts live. Every
  # manuscript's clone path is validated to resolve inside this directory.
  # Defaults to /repos (the path the install script mounts into the container).
  repos_dir: "/repos"

# ============================================================
# Git Repository Registry (registry-to-DB, changeset 037)
# ============================================================
# Since the registry-to-DB refactor, WHAT a manuscript is lives in the
# database (created via the UI or reconciled from the legacy manuscripts:
# section below). Config keeps only what the operator must supply: how to
# reach external repos (credentials/topology).
#
#   git_repos:
#     - name: "my-book-repo"        # key referenced by manuscript rows
#       slug: "yourusername/repo"   # canonical owner/repo (webhook matching)
#       use_ssh: false
#       auth_token: ""              # PAT for private HTTPS repos
#       # url: ""                   # escape hatch: non-GitHub / local path
#       # webhook_secret: ""        # per-repo override of auth.webhook_secret
#
# LOCAL-mode manuscripts (created from the UI) need no entry here at all —
# their repos live under <repos_dir>/git/local/<name>, owned by the server.
# ⚠ BACK UP <repos_dir>/git/local/ — those repos exist nowhere else.
git_repos: []

# ============================================================
# Manuscript Definitions (LEGACY — still honored)
# ============================================================
# Each entry is upserted into the manuscript table at startup and a
# git_repos entry of the same name is synthesized from its repository:
# block. New setups can define git_repos above and create manuscripts from
# the UI instead.
manuscripts:
  - name: "example-book"  # Internal identifier (URL-safe)

    repository:
      # Canonical "owner/repo" identifier. The clone URL is derived from
      # this and `use_ssh` below. Also used to match incoming GitHub
      # webhooks (compared to payload.repository.full_name).
      slug: "yourusername/your-repo"

      # If true, clone via SSH (git@github.com:<slug>.git). Requires an
      # SSH key on the server. If false (default), clone via HTTPS — set
      # `auth_token` below for private repos.
      use_ssh: false

      # Branch to track
      branch: "main"

      # Path to manuscript file within the repository
      path: "manuscript.md"

      # GitHub Personal Access Token with repo read access. Only needed
      # when use_ssh: false AND the repo is private. Create at:
      # https://github.com/settings/tokens
      auth_token: "REPLACE_ME_OR_SERVER_WONT_START"

      # Escape hatch — set this only if you need a non-GitHub URL or a
      # local filesystem path (e.g. for testing). When set, it overrides
      # the slug+use_ssh derivation.
      # url: "/var/local/repos/example-book"

    # Per-manuscript webhook secret (optional)
    # Overrides global webhook_secret for this manuscript
    # webhook_secret: "manuscript-specific-secret"

  # Example of second manuscript (uncomment to use)
  # - name: "another-book"
  #   repository:
  #     slug: "yourusername/another-repo"
  #     use_ssh: true                   # SSH clone — no auth_token needed
  #     branch: "main"
  #     path: "book.manuscript"

# ============================================================
# Authentication Settings
# ============================================================
auth:
  # Admin user — seeded/updated on every install.sh run.
  # Automatically granted access to every manuscript defined below.
  admin_username: "admin"
  admin_password: "REPLACE_ME_OR_SERVER_WONT_START"

  # System token for admin API endpoints
  # Generate with: openssl rand -hex 32
  system_token: "REPLACE_ME_OR_SERVER_WONT_START"

  # GitHub webhook validation secret (required when env=production)
  # Must match the secret configured in GitHub webhook settings.
  # Generate with: openssl rand -hex 32
  webhook_secret: "REPLACE_ME_OR_SERVER_WONT_START"

# ============================================================
# Server Configuration
# ============================================================
server:
  port: 5001
  host: "0.0.0.0"
  env: "production"  # or "development"

  # URL prefix when hosted under a path (e.g. "/manuscripts" for example.com/manuscripts).
  # Leave empty or "/" when hosted at the root of a domain/subdomain.
  # Must match the Apache <Location> path.
  base_path: ""

# ============================================================
# Logging Configuration
# ============================================================
logging:
  directory: "~/.config/manuscript-studio/logs"
  level: "info"  # debug, info, warn, error
  max_age_days: 30
  max_size_mb: 100
  rotate: true

# ============================================================
# Migration Settings
# ============================================================
migrations:
  # Lock manuscript during migration to prevent concurrent edits
  lock_during_migration: true

  # Whether to backup before migration (relies on DB backups if false)
  backup_before_migration: false

  # Queue annotations created during migration
  queue_annotations: true

# ============================================================
# Rate Limits
# ============================================================
# Per-process token-bucket limits on /api/admin/* endpoints. Keyed by the
# Authorization header (per-token), or remote IP when no header is present.
# Set to 0 to disable.
rate_limits:
  admin_per_token_rpm: 10
  admin_per_token_burst: 5

# ============================================================
# Wordcount History (optional). When enabled, an in-process cron
# recomputes each manuscript's daily wordcount row every
# interval_minutes (rows are keyed by day — intra-day runs overwrite
# today's row, so the number is at most an hour stale while the table
# grows by only one row per manuscript per day). The homepage and
# manuscript-header wordcounts are then served from this table:
# effective words (committed + pending suggestions, all users) plus
# linked, not-yet-canonized snippet words. When disabled, nothing
# runs and the live committed count is used everywhere, as before.
# ============================================================
wordcount_history:
  enabled: false
  interval_minutes: 60
  # IANA timezone defining the day cutoff for rows. Default UTC.
  timezone: "UTC"
