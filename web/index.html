<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript Studio</title>

  <!-- Caveat — handwriting font for note-input textareas. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <!-- Book-style CSS -->
  <link rel="stylesheet" href="css/book.css?v=111">
  <link rel="stylesheet" href="css/chrome.css?v=3">

  <!-- Paged.js for book pagination - loaded but not auto-run -->
  <script>
    // Prevent Paged.js from auto-running on page load
    window.PagedConfig = {
      auto: false
    };
  </script>
  <!-- Pinned: unpkg's bare "pagedjs" redirects to whatever is newest; an
       upstream release must not silently change our pagination engine. -->
  <script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.js"></script>
</head>
<body>
  <!-- Top bar (not paginated) -->
  <div id="controls" class="pagedjs_ignore">
    <div class="control-group control-group-left">
      <a id="home-link" href="home.html" title="Home" aria-label="Home">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true">
          <path fill="currentColor" d="M8 1 1 7h2v7h4v-4h2v4h4V7h2L8 1z"/>
        </svg>
      </a>
      <a id="brand" href="home.html">manuscript studio</a>
      <div id="global-search">
        <input id="gs-input" type="text" placeholder="Search manuscripts and scratchpads…" autocomplete="off">
        <div id="gs-dropdown" hidden></div>
      </div>
    </div>
    <div class="control-group control-group-right">
      <button id="logout-btn" onclick="logout()">Logout</button>
      <span id="cheatsheet-icon" tabindex="0" role="button" aria-label="Syntax cheatsheet" aria-expanded="false" title="Syntax cheatsheet">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M2 2.75A1.75 1.75 0 0 1 3.75 1h6.5A1.75 1.75 0 0 1 12 2.75v10.5A1.75 1.75 0 0 1 10.25 15h-6.5A1.75 1.75 0 0 1 2 13.25V2.75zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h6.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25h-6.5zM4.5 4.75A.75.75 0 0 1 5.25 4h3.5a.75.75 0 0 1 0 1.5h-3.5a.75.75 0 0 1-.75-.75zm0 3A.75.75 0 0 1 5.25 7h3.5a.75.75 0 0 1 0 1.5h-3.5a.75.75 0 0 1-.75-.75zm0 3a.75.75 0 0 1 .75-.75h2a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1-.75-.75z"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- Syntax cheatsheet: slide-in right panel toggled by #cheatsheet-icon -->
  <div id="cheatsheet-panel" class="pagedjs_ignore" aria-hidden="true"></div>
  <div id="cheatsheet-backdrop" class="pagedjs_ignore" hidden></div>

  <!-- Annotation margin container (floating in right grey margin) -->
  <div id="annotation-margin" class="pagedjs_ignore">
    <div class="annotation-margin-inner">
      <!-- Sentence preview (first 3 words) -->
      <div id="sentence-preview" class="sentence-preview"></div>

      <!-- Container for all sticky notes (rendered dynamically) -->
      <div id="sticky-notes-container">
        <!-- Multiple sticky notes will be rendered here -->
      </div>
    </div>
  </div>

  <!-- Manuscript chrome (HOME_PLAN.md): title + info line left, GitHub
       push right — above the outline in the left margin. -->
  <div id="manuscript-chrome" class="pagedjs_ignore">
    <div class="mc-left">
      <span id="mc-name"></span>
      <span id="mc-info"></span>
    </div>
    <span id="push-button-container" class="push-button-container"></span>
  </div>

  <!-- Left-margin document outline (floating in left grey margin) -->
  <div id="outline-margin" class="pagedjs_ignore"></div>

  <!-- Container for entire app -->
  <div id="app-container">
    <!-- Manuscript content (will be paginated by Paged.js) -->
    <div id="manuscript-content">
    </div>
  </div>

  <!-- Auth check (must run first) -->
  <script src="js/auth.js"></script>
  <script>
    // Check authentication before loading the app
    (async function() {
      const session = await checkAuth();
      if (!session) return; // Will redirect to login

      window.currentSession = session;

      if (session.csrf_token) {
        sessionStorage.setItem('csrf_token', session.csrf_token);
      }
    })();
  </script>

  <!-- External libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/smartquotes/2.3.2/smartquotes.min.js"></script>

  <!-- Paged.js configuration (must load after Paged.js, before renderer) -->
  <script src="js/pagedjs-config.js?v=5"></script>

  <!-- rainbow-slice: array utility (vendored from github.com/slackwing/tuft) -->
  <script src="js/rainbow-slice.js"></script>

  <!-- Application scripts -->
  <script src="js/text-markers.js?v=2"></script>
  <script src="js/command.js?v=14"></script>
  <script src="js/canonicalize.js?v=1"></script>
  <script src="js/placeholder.js?v=2"></script>
  <script src="js/renderer.js?v=93"></script>
  <script src="js/annotations.js?v=52"></script>
  <script src="js/vendor/diff-match-patch.js"></script>
  <script src="js/history.js?v=8"></script>
  <script src="js/suggestions.js?v=14"></script>
  <script src="js/push.js?v=6"></script>
  <script src="js/outline.js?v=11"></script>
  <script src="scratchpad/region.js?v=1"></script>
  <script src="js/import-scratchpad.js?v=5"></script>
  <script src="js/global-search.js?v=3"></script>
  <script src="js/scratchpad-modal.js?v=5"></script>
  <script src="js/cheatsheet.js?v=2"></script>
</body>
</html>
