<!DOCTYPE html>
<html lang="en" class="has-ms-tabs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript Studio</title>

  <!-- Caveat — handwriting font for note-input textareas. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <!-- Book-style CSS -->
  <link rel="stylesheet" href="css/book.css?v=236">
  <link rel="stylesheet" href="notes/note-widget.css?v=3">
  <link rel="stylesheet" href="scratchpad/scratchpad.css?v=69">
  <link rel="stylesheet" href="css/chrome.css?v=23">

  <!-- Paged.js for book pagination - loaded but not auto-run -->
  <script>
    // Prevent Paged.js from auto-running on page load
    window.PagedConfig = {
      auto: false
    };
  </script>
  <!-- Pinned: unpkg's bare "pagedjs" redirects to whatever is newest; an
       upstream release must not silently change our pagination engine. -->
  <script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.js"></script>
</head>
<body>
  <!-- Top bar (not paginated) — shared, filled synchronously by chrome.js.
       data-extras adds this page's cheatsheet toggle to the right group. -->
  <div id="controls" class="pagedjs_ignore" data-extras="cheatsheet"></div>
  <script src="js/chrome.js?v=5"></script>
  <script src="js/tabs.js?v=15"></script>

  <!-- Syntax cheatsheet: slide-in right panel toggled by #cheatsheet-icon -->
  <div id="cheatsheet-panel" class="pagedjs_ignore" aria-hidden="true"></div>
  <div id="cheatsheet-backdrop" class="pagedjs_ignore" hidden></div>

  <!-- Note margin container (floating in right grey margin) -->
  <div id="note-margin" class="pagedjs_ignore">
    <div class="note-margin-inner">
      <!-- ‹ sentence preview (first 3 words) › — the note tour's prev/next
           flank the preview; the row hugs the first note below. -->
      <div id="note-nav-row" class="note-nav-row">
        <button type="button" class="note-nav-btn note-nav-prev" hidden>&lsaquo;</button>
        <div id="sentence-preview" class="sentence-preview"></div>
        <button type="button" class="note-nav-btn note-nav-next" hidden>&rsaquo;</button>
      </div>

      <!-- Container for all sticky notes (rendered dynamically) -->
      <div id="sticky-notes-container">
        <!-- Multiple sticky notes will be rendered here -->
      </div>
    </div>
  </div>

  <!-- Manuscript chrome (HOME_PLAN.md): title + info line left, GitHub
       push right — above the outline in the left margin. The pane tabs
       (OUTLINE / STATISTICS) sit just above the chrome's bottom rule and
       switch what the band below shows (STATS_PLAN). -->
  <div id="manuscript-chrome" class="pagedjs_ignore">
    <div class="mc-top">
      <span id="mc-name"></span>
      <span id="mc-info"></span>
      <!-- Controls row under the info line: settings left, Push/Commit right. -->
      <div class="mc-controls-row">
        <button type="button" id="mc-settings" class="mc-btn mc-settings" title="Manuscript settings" aria-label="Manuscript settings" data-icon="gear"></button>
        <button type="button" id="mc-daily" class="mc-btn mc-daily" title="Daily tasks" aria-label="Daily tasks" data-icon="dailyTasks"></button>
        <span id="push-button-container" class="push-button-container"></span>
      </div>
    </div>
    <nav id="pane-tabs" class="pane-tabs">
      <a class="pane-tab active" data-pane="outline">Outline</a>
      <a class="pane-tab" data-pane="stats">Statistics</a>
      <a class="pane-tab" data-pane="people">People</a>
    </nav>
  </div>

  <!-- Left-margin document outline (floating in left grey margin) -->
  <div id="outline-margin" class="pagedjs_ignore"></div>

  <!-- Left-margin statistics pane — the outline's sibling; the pane tabs
       above pick which one shows. -->
  <div id="stats-margin" class="pagedjs_ignore"></div>

  <!-- Left-margin People pane (PERMISSIONS_PLAN v3 §6) — third tab. -->
  <div id="people-margin" class="pagedjs_ignore"></div>

  <!-- Container for entire app -->
  <div id="app-container">
    <!-- Manuscript content (will be paginated by Paged.js) -->
    <div id="manuscript-content">
    </div>
  </div>

  <!-- Auth check (must run first) -->
  <script src="js/auth.js?v=3"></script>
  <script src="js/session-guard.js?v=4"></script>
  <script src="js/edit-pane.js?v=10"></script>
  <script src="js/icons.js?v=11"></script>
  <script src="js/manuscript-chip.js?v=8"></script>
  <script>
    // Check authentication before loading the app
    (async function() {
      const session = await checkAuth();
      if (!session) return; // Will redirect to login

      window.currentSession = session;

      if (session.csrf_token) {
        sessionStorage.setItem('csrf_token', session.csrf_token);
      }
    })();
  </script>

  <!-- External libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/smartquotes/2.3.2/smartquotes.min.js"></script>

  <!-- Paged.js configuration (must load after Paged.js, before renderer) -->
  <script src="js/attention.js?v=14"></script>
  <script src="js/footnotes.js?v=1"></script>
  <script src="js/pagedjs-config.js?v=15"></script>

  <!-- rainbow-slice: array utility (vendored from github.com/slackwing/tuft) -->
  <script src="js/rainbow-slice.js"></script>

  <!-- Application scripts -->
  <script src="js/text-markers.js?v=4"></script>
  <script src="js/command.js?v=23"></script>
  <script src="js/note-default.js?v=1"></script>
  <script src="js/canonicalize.js?v=7"></script>
  <script src="js/placeholder.js?v=3"></script>
  <script src="js/marker-symbols.js?v=3"></script>
  <script src="js/renderer.js?v=151"></script>
  <!-- Shared note component — must load BEFORE notes.js (the manuscript margin
       renders through it). -->
  <script src="notes/note-api.js?v=7"></script>
  <script src="notes/note-widget.js?v=31"></script>
  <script src="js/notes.js?v=78"></script>
  <script src="js/vendor/diff-match-patch.js"></script>
  <script src="js/history.js?v=12"></script>
  <script src="js/pane-widget.js?v=11"></script>
  <script src="js/suggestions.js?v=79"></script>
  <script src="js/push.js?v=25"></script>
  <script src="js/manuscript-modal.js?v=7"></script>
  <script src="js/outline.js?v=20"></script>
  <script src="js/stats.js?v=20"></script>
  <script src="js/people.js?v=4"></script>
  <script src="js/actions.js?v=2"></script>
  <script src="scratchpad/region.js?v=6"></script>
  <script src="scratchpad/scratch-render.js?v=20"></script>
  <script src="js/manuscript-normalize.js?v=2"></script>
  <script src="js/import-docx.js?v=3"></script>
  <script src="js/import-scratchpad.js?v=29"></script>
  <script src="js/range-delete.js?v=9"></script>
  <script src="js/sketch-from-selection.js?v=5"></script>
  <script src="js/copy-selection.js?v=2"></script>
  <script src="js/global-search.js?v=5"></script>
  <script src="js/scratchpad-modal.js?v=84"></script>
  <script src="js/cheatsheet.js?v=6"></script>
</body>
</html>
