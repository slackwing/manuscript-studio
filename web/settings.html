<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Manuscript Studio</title>
  <link rel="stylesheet" href="css/book.css?v=167">
  <link rel="stylesheet" href="css/chrome.css?v=3">
  <link rel="stylesheet" href="css/home.css?v=27">
</head>
<body class="home-page">

  <div id="controls" class="pagedjs_ignore">
    <div class="control-group control-group-left">
      <a id="home-link" href="home.html" title="Home" aria-label="Home">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true">
          <path fill="currentColor" d="M8 1 1 7h2v7h4v-4h2v4h4V7h2L8 1z"/>
        </svg>
      </a>
      <a id="brand" href="home.html">manuscript studio</a>
      <div id="global-search">
        <input id="gs-input" type="text" placeholder="Search" autocomplete="off">
        <div id="gs-dropdown" hidden></div>
      </div>
    </div>
    <div class="control-group control-group-right">
      <a id="settings-link" href="settings.html" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 4.75a3.25 3.25 0 100 6.5 3.25 3.25 0 000-6.5zM6.5 8a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0z"/><path fill="currentColor" d="M9.4 1l.35 1.8c.4.14.78.33 1.13.55l1.73-.63 1.4 2.42-1.38 1.17a5.6 5.6 0 010 1.38l1.38 1.17-1.4 2.42-1.73-.63c-.35.22-.73.41-1.13.55L9.4 13H6.6l-.35-1.8a5.6 5.6 0 01-1.13-.55l-1.73.63L2 8.86l1.38-1.17a5.6 5.6 0 010-1.38L2 5.14l1.4-2.42 1.73.63c.35-.22.73-.41 1.13-.55L6.6 1h2.8z" fill-rule="evenodd" opacity="0.85"/></svg>
      </a>
      <button id="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <main class="home-main" id="settings-root">
    <section class="home-section">
      <div class="home-section-head">
        <h2>Non-task types</h2>
      </div>
      <div class="settings-section">
        <div id="nt-chips" class="tt-chips"></div>
        <input id="nt-input" type="text" placeholder="new-type another-type …" autocomplete="off">
        <div id="nt-status" class="settings-hint"></div>
      </div>
    </section>
    <section class="home-section">
      <div class="home-section-head">
        <h2>Task types</h2>
      </div>
      <div class="settings-section">
        <div id="tt-chips" class="tt-chips"></div>
        <input id="tt-input" type="text" placeholder="new-type another-type …" autocomplete="off">
        <div id="tt-status" class="settings-hint"></div>
      </div>
    </section>
    <section class="home-section">
      <div class="home-section-head">
        <h2>Daily task rules</h2>
      </div>
      <div class="settings-section">
        <div id="dr-list"></div>
        <div id="dr-builder" class="dr-row"></div>
        <div id="dr-status" class="settings-hint"></div>
      </div>
    </section>
    <section class="home-section">
      <div class="home-section-head">
        <h2>Note actions</h2>
      </div>
      <div class="settings-section na-section">
        <table class="na-table"><tbody id="na-rows"></tbody></table>
        <div id="na-status" class="settings-hint"></div>
      </div>
    </section>
  </main>

  <script src="js/auth.js?v=3"></script>
  <script src="js/session-guard.js?v=3"></script>
  <script src="js/icons.js?v=5"></script>
  <script src="js/global-search.js?v=3"></script>
  <script src="notes/note-widget.js?v=24"></script>
  <script>
    (async function () {
      const session = await checkAuth();
      if (!session) return;
      if (session.csrf_token) sessionStorage.setItem('csrf_token', session.csrf_token);
    })();
  </script>
  <script src="js/settings.js?v=9"></script>
</body>
</html>
