<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript Studio</title>
  <!-- Caveat — handwriting font for note-input textareas (scratchpad note floats
       are opened from here too, so the font must load on the landing page). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/book.css?v=191">
  <link rel="stylesheet" href="css/chrome.css?v=4">
  <link rel="stylesheet" href="css/home.css?v=31">
</head>
<body class="home-page">

  <!-- Shared top bar — filled synchronously by chrome.js (must load right here). -->
  <div id="controls" class="pagedjs_ignore"></div>
  <script src="js/chrome.js?v=1"></script>

  <main class="home-main" id="home-root">
    <!-- rendered by home.js -->
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/smartquotes/2.3.2/smartquotes.min.js"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/session-guard.js?v=3"></script>
  <script src="js/edit-pane.js?v=7"></script>
  <script src="js/icons.js?v=5"></script>
  <script src="js/manuscript-chip.js?v=8"></script>
  <script>
    (async function() {
      const session = await checkAuth();
      if (!session) return;
      window.currentSession = session;
      if (session.csrf_token) sessionStorage.setItem('csrf_token', session.csrf_token);
      if (window.WriteSysHome) window.WriteSysHome.init();
    })();
  </script>

  <!-- Book-render pipeline: needed by the scratchpad modal’s sketch
       widgets (same set the old scratchpad page loaded). text-markers.js
       must precede renderer.js (shared escapeHTML + §/¶ glyph constants). -->
  <script src="js/text-markers.js?v=4"></script>
  <script src="js/command.js?v=18"></script>
  <script src="js/canonicalize.js?v=6"></script>
  <script src="js/placeholder.js?v=3"></script>
  <script src="js/renderer.js?v=118"></script>
  <script src="scratchpad/region.js?v=5"></script>
  <script src="scratchpad/scratch-render.js?v=16"></script>

  <script src="js/global-search.js?v=3"></script>
  <script src="notes/note-api.js?v=5"></script>
  <script src="notes/note-widget.js?v=25"></script>
  <script src="js/scratchpad-modal.js?v=72"></script>
  <script src="js/actions.js?v=1"></script>
  <script src="js/pane-widget.js?v=10"></script>
  <script src="js/manuscript-modal.js?v=5"></script>
  <script src="js/home.js?v=26"></script>
</body>
</html>
