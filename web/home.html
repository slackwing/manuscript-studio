<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript Studio</title>
  <!-- Caveat — handwriting font for note-input textareas (scratchpad note floats
       are opened from here too, so the font must load on the landing page). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/book.css?v=159">
  <link rel="stylesheet" href="css/chrome.css?v=3">
  <link rel="stylesheet" href="css/home.css?v=21">
</head>
<body class="home-page">

  <div id="controls" class="pagedjs_ignore">
    <div class="control-group control-group-left">
      <a id="home-link" href="home.html" title="Home" aria-label="Home">
        <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true">
          <path fill="currentColor" d="M8 1 1 7h2v7h4v-4h2v4h4V7h2L8 1z"/>
        </svg>
      </a>
      <a id="brand" href="home.html">manuscript studio</a>
      <div id="global-search">
        <input id="gs-input" type="text" placeholder="Search" autocomplete="off">
        <div id="gs-dropdown" hidden></div>
      </div>
    </div>
    <div class="control-group control-group-right">
      <a id="settings-link" href="settings.html" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 4.75a3.25 3.25 0 100 6.5 3.25 3.25 0 000-6.5zM6.5 8a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0z"/><path fill="currentColor" d="M9.4 1l.35 1.8c.4.14.78.33 1.13.55l1.73-.63 1.4 2.42-1.38 1.17a5.6 5.6 0 010 1.38l1.38 1.17-1.4 2.42-1.73-.63c-.35.22-.73.41-1.13.55L9.4 13H6.6l-.35-1.8a5.6 5.6 0 01-1.13-.55l-1.73.63L2 8.86l1.38-1.17a5.6 5.6 0 010-1.38L2 5.14l1.4-2.42 1.73.63c.35-.22.73-.41 1.13-.55L6.6 1h2.8z" fill-rule="evenodd" opacity="0.85"/></svg>
      </a>
      <button id="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <main class="home-main" id="home-root">
    <!-- rendered by home.js -->
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/smartquotes/2.3.2/smartquotes.min.js"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/session-guard.js?v=3"></script>
  <script src="js/edit-pane.js?v=4"></script>
  <script src="js/icons.js?v=2"></script>
  <script src="js/manuscript-chip.js?v=8"></script>
  <script>
    (async function() {
      const session = await checkAuth();
      if (!session) return;
      window.currentSession = session;
      if (session.csrf_token) sessionStorage.setItem('csrf_token', session.csrf_token);
      if (window.WriteSysHome) window.WriteSysHome.init();
    })();
  </script>

  <!-- Book-render pipeline: needed by the scratchpad modal’s sketch
       widgets (same set the old scratchpad page loaded). -->
  <script src="js/command.js?v=17"></script>
  <script src="js/canonicalize.js?v=3"></script>
  <script src="js/placeholder.js?v=3"></script>
  <script src="js/renderer.js?v=106"></script>
  <script src="scratchpad/region.js?v=3"></script>
  <script src="scratchpad/scratch-render.js?v=8"></script>

  <script src="js/global-search.js?v=3"></script>
  <script src="notes/note-api.js?v=5"></script>
  <script src="notes/note-widget.js?v=21"></script>
  <script src="js/scratchpad-modal.js?v=52"></script>
  <script src="js/home.js?v=19"></script>
</body>
</html>
