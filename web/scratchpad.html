<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratchpads — Manuscript Studio</title>
  <link rel="stylesheet" href="scratchpad/scratchpad.css?v=1">
</head>
<body class="scratchpad-page">

  <header class="sp-header">
    <a class="sp-back" href="index.html">‹ Book</a>
    <span class="sp-app">Scratchpads</span>
    <span class="sp-spacer"></span>
    <span id="save-status" class="sp-save">Saved</span>
  </header>

  <main class="sp-main">
    <aside class="sp-sidebar">
      <button type="button" id="new-pad" class="sp-new">+ New scratchpad</button>
      <div id="pad-list" class="sp-list"></div>
    </aside>

    <section class="sp-content">
      <div id="empty-state" class="sp-empty" hidden>
        <p>Select a scratchpad — or create one.</p>
        <p class="sp-empty-hint">Scratchpads are yours (not tied to one manuscript). Draft in rich
        text, add book-content blocks in .manuscript form, then canonize them
        into a book from the book view's + between paragraphs.</p>
      </div>
      <div id="editor-shell">
        <input id="pad-title" class="sp-title" type="text" placeholder="Untitled" autocomplete="off">
        <div id="toolbar" class="sp-toolbar"></div>
        <div id="editor" class="sp-editor"></div>
      </div>
    </section>
  </main>

  <input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/smartquotes/2.3.2/smartquotes.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/command.js?v=14"></script>
  <script src="js/canonicalize.js?v=1"></script>
  <script src="js/placeholder.js?v=1"></script>
  <script src="js/renderer.js?v=89"></script>
  <script src="scratchpad/region.js?v=1"></script>
  <script src="scratchpad/scratch-render.js?v=1"></script>
  <script type="module" src="scratchpad/editor.mjs?v=1"></script>
</body>
</html>
