<!DOCTYPE html>
<!-- The scratchpad page died (HOME_PLAN.md): scratchpads are modal-only.
     This stub keeps old bookmarks working: ?scratchpad_id=N becomes
     home.html#scratchpad=N (which reopens the pad in THE modal). -->
<html lang="en">
<head><meta charset="UTF-8"><title>Manuscript Studio</title></head>
<body>
<script>
  var id = new URLSearchParams(window.location.search).get('scratchpad_id');
  window.location.replace('home.html' + (id ? '#scratchpad=' + id : ''));
</script>
</body>
</html>
