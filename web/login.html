<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript Studio — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* The library wall, floor to ceiling. A soft vignette keeps the card
       legible over the busy shelves without dimming the room's warmth. */
    body {
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #2b2419 url("img/login-bookshelf.jpg") center / cover no-repeat fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(20, 15, 8, 0.25) 0%, rgba(20, 15, 8, 0.55) 100%),
        linear-gradient(rgba(20, 15, 8, 0.1), rgba(20, 15, 8, 0.35));
      pointer-events: none;
    }

    .login-container {
      position: relative;
      background: rgba(251, 248, 240, 0.82);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 14px;
      box-shadow:
        0 30px 80px -20px rgba(10, 8, 4, 0.7),
        inset 0 1px 0 rgba(255, 250, 235, 0.6);
      padding: 44px 42px 38px;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #2f2415;
      margin-bottom: 6px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .subtitle {
      text-align: center;
      color: #6b5c42;
      margin-bottom: 28px;
      font-size: 12px;
      font-family: Helvetica, Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    /* A little gilt rule under the title, like a spine ornament. */
    .subtitle::after {
      content: "";
      display: block;
      width: 54px;
      height: 2px;
      margin: 14px auto 0;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #4a3d28;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    select, input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbb98f;
      border-radius: 7px;
      font-size: 15px;
      font-family: Georgia, serif;
      background: rgba(255, 253, 247, 0.9);
      color: #2f2415;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #c9a227;
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
    }

    /* The button is the bookbinding: leather with a gilt edge. */
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(170deg, #7a5a34 0%, #5b3f22 60%, #6b4a28 100%);
      color: #f3e6c4;
      border: 1px solid #c9a227;
      border-radius: 7px;
      font-size: 16px;
      font-family: Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 236, 180, 0.35), 0 4px 14px -6px rgba(10, 8, 4, 0.6);
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255, 236, 180, 0.35), 0 8px 20px -8px rgba(10, 8, 4, 0.7);
    }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: none; }

    .error {
      background: rgba(250, 236, 232, 0.95);
      color: #a33;
      border: 1px solid #ddb0a8;
      padding: 11px 12px;
      border-radius: 7px;
      margin-bottom: 18px;
      font-size: 13px;
      font-family: Helvetica, Arial, sans-serif;
      display: none;
    }
    .error.show { display: block; }

    .password-toggle { position: relative; }
    .password-toggle input { padding-right: 40px; }
    .password-toggle button {
      position: absolute;
      right: 0;
      top: 0;
      width: 40px;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      color: #6b5c42;
      font-size: 12px;
      margin: 0;
      text-shadow: none;
    }
    .password-toggle button:hover { transform: none; box-shadow: none; filter: none; color: #2f2415; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Manuscript Studio</h1>
    <p class="subtitle">Sign in to continue</p>

    <div id="error" class="error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">User</label>
        <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-toggle">
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" id="login-btn">Log In</button>
    </form>
  </div>

  <script>
    // All URLs are relative so <base href> injected by the server handles path prefix.

    // Manuscript selection happens AFTER login via the top-bar picker.
    // The login response carries the user's accessible manuscripts and which
    // one to land on (last_manuscript_name; falls back to the first one).

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please fill in all fields');
        return;
      }

      const loginBtn = document.getElementById('login-btn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Login failed');
        }

        const data = await response.json();
        if (data.csrf_token) {
          localStorage.setItem('csrf_token', data.csrf_token); // localStorage: SHARED across tabs (sessionStorage skew caused save-403 data loss)
        }
        // The session guard's re-login modal prefills this on expiry.
        localStorage.setItem('ms_last_username', username);

        // Pick landing manuscript: last opened (if still accessible),
        // else the first accessible, else open the empty app.
        // Login always lands on the home page (HOME_PLAN.md) — it IS the
        // resume surface: recents are right there, one click deep.
        window.location.href = 'home.html';
      } catch (error) {
        showError(error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');

      setTimeout(() => {
        errorDiv.classList.remove('show');
      }, 5000);
    }

    // Prefill the last-used name (also feeds the in-place re-login modal).
    (function () {
      const last = localStorage.getItem('ms_last_username');
      const u = document.getElementById('username');
      if (last) { u.value = last; document.getElementById('password').focus(); }
      else u.focus();
    })();
  </script>
</body>
</html>
